name: Dependabot auto-merge

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - if: contains(fromJSON('["version-update:semver-patch", "version-update:semver-minor"]'), steps.metadata.outputs.update-type)
        run: |
          set -euo pipefail
          required=$(gh api "repos/$GITHUB_REPOSITORY/rules/branches/$BASE_REF" \
            --jq '[.[] | select(.type == "required_status_checks") | .parameters.required_status_checks[] | select(.integration_id == 15368)] | length')
          if [ "$required" -eq 0 ]; then
            echo "Configure the required CI check ruleset before enabling auto-merge." >&2
            exit 1
          fi
          gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          GH_TOKEN: ${{ secrets.QUANTUMCRAFTBOT_TOKEN || github.token }}
