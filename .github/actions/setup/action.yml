name: Repository tools
description: Install the pinned Rust toolchain and development checks
inputs:
  targets:
    description: Additional Rust compilation targets
    default: ''
  tools:
    description: Install extended analysis tools
    default: 'true'
runs:
  using: composite
  steps:
    - id: toolchain
      shell: bash
      run: sed -n 's/^channel = "\(.*\)"/version=\1/p' rust-toolchain.toml >> "$GITHUB_OUTPUT"
    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      with:
        toolchain: ${{ steps.toolchain.outputs.version }}
        components: rustfmt, clippy, llvm-tools-preview
        targets: ${{ inputs.targets }}
    - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      with:
        just-version: '1.58.0'
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        key: ${{ inputs.targets }}
    - name: Install command deadline utility
      shell: bash
      run: |
        if ! command -v timeout >/dev/null 2>&1; then
          brew install coreutils
        fi
    - name: Install analysis tools
      if: inputs.tools == 'true'
      shell: bash
      run: just setup-tools
