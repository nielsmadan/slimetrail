[package]
name = "slimetrail"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Read-only local coding-agent session library"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
sha2 = "0.10"
jiff = { version = "0.2", features = ["serde"] }
tempfile = "3"
rusqlite = { version = "0.37", features = ["bundled"] }
regex = "1"

[lints.rust]
unsafe_code = "forbid"
